name: release

# Tagged releases publish an image. Multi-arch is not optional: self-hosting is
# often arm64 while cloud hosts are amd64, and a single-arch image forces emulation
# on one of them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Deliberately not type=semver,pattern={{major}}: metadata-action omits
            # a bare major for 0.x, on the reasoning that "0" promises a stability
            # 0.x has not earned. That reasoning is sound and this project wants the
            # moving pointer anyway, so the major is matched out of the tag instead.
            type=match,pattern=v(\d+),group=1
            # Keyed off the tag, not the branch: this workflow runs on a tag push,
            # where is_default_branch is false and `latest` would never be published.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The container is the release; this is the note that says so. Kept separate from
  # publish so a release never announces an image that failed to build.
  announce:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Re-running a tag must not fail the build, and must never overwrite notes
          # that have since been edited by hand.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Leaving it alone."
            exit 0
          fi

          heading="## v$version"
          title=$(awk -v h="$heading" 'index($0,h)==1 {print substr($0,4); exit}' CHANGELOG.md)
          notes=$(awk -v h="$heading" '
            index($0, h) == 1 { found=1; next }
            found && index($0, "## v") == 1 { exit }
            found { print }
          ' CHANGELOG.md)

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          footer=$(printf '\n---\n\n```\ndocker pull %s:%s\n```\n' "$image" "$version")

          # A version with no changelog section still gets a release, from whatever
          # GitHub can work out of the commits.
          if [ -z "$notes" ]; then
            echo "No changelog section for v$version; falling back to generated notes."
            gh release create "$tag" --title "${title:-$tag}" --generate-notes --notes "$footer"
          else
            gh release create "$tag" --title "${title:-$tag}" --notes "$notes$footer"
          fi
          echo "Created release $tag."
