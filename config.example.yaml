# Behaviour. Identity and secrets live in .env instead.
# Copy to $PAKLED_DATA_DIR/config.yaml (./data/config.yaml by default).
#
# Sections are added by the ticket that first needs them; unknown keys are ignored,
# so this file may safely run ahead of the code.

enabled: true

logging:
  level: info # debug | info | warn | error

development:
  dryRun: false

# Ceremonies fire at a random interval within these bounds — deliberately not a cron,
# so they stay unpredictable. The next timestamp is persisted: restarting the bot
# resumes the existing schedule rather than starting a new one.
#
# A failed Ceremony retries within the short window instead of waiting days. After
# maxConsecutiveFailures, the circuit breaker trips and Ceremonies stop until an
# operator runs /helmet resume.
ceremony:
  enabled: true
  minIntervalHours: 72     # 3 days
  maxIntervalHours: 336    # 14 days
  retryMinMinutes: 15
  retryMaxMinutes: 60
  maxConsecutiveFailures: 3
  checkIntervalSeconds: 60

# The model is a configuration string and appears nowhere in application logic.
# The request is deliberately the cheapest, plainest one that still sounds like the
# character: reasoning disabled, no tools, routed to the cheapest provider, tight
# token ceilings. This bot writes two sentences in a simple voice — there is nothing
# to reason about, and paying for reasoning actively made it worse.
#
# Measured against 33 golden samples per model (`npm run dev golden <model...>`):
#   deepseek/deepseek-v4-flash   cheapest, and the most disciplined on length. Default.
#   z-ai/glm-5.2                 good voice, but rambles past where a Pakled would stop.
#   moonshotai/kimi-k2.6         good voice, ~10x the price, no benefit here.
#
# With reasoning left ON, kimi-k2.6 fell back on almost every sample and glm-5.2
# intermittently returned nothing: thinking tokens exhaust the budget and the
# preamble breaks the JSON contract. Disabling it fixed all three models outright.
llm:
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  promptPath: prompts/pakled-conversation.md
  minRequestIntervalMs: 1500

# Where failures are reported. The Pakled never speaks unprompted in the admin
# channel, so its incident reports are not talked over.
channels:
  adminChannelId: null
  deny: []

# Who may receive a helmet. Everyone in the server is eligible by default; other
# bots are always excluded, and members the bot cannot assign roles to are skipped
# automatically. The Pakled itself is always eligible (ADR-0001).
participants:
  excludedUserIds: []
  excludedRoleIds: []

# The Helmet Set, smallest to largest. Rank is authoritative — Discord role
# position is never used to infer it. Ids are the stable identity: renaming a
# helmet renames its role, but changing an id creates a new one.
#
# WARNING: removing a helmet from this list deletes the Discord role the bot
# provisioned for it, stripping it from whoever holds it. See ADR-0003.
helmets:
  - { id: tiny,      name: "A Tiny Helmet",           rank: 1,  color: "#8a8a8a" }
  - { id: little,    name: "A Little Helmet",         rank: 2,  color: "#9a9a8a" }
  - { id: modest,    name: "A Modest Helmet",         rank: 3,  color: "#a89f7a" }
  - { id: respectable, name: "A Respectable Helmet",  rank: 4,  color: "#b8a45f" }
  - { id: sizeable,  name: "A Sizeable Helmet",       rank: 5,  color: "#c7a63f" }
  - { id: very_sizeable, name: "A Very Sizeable Helmet", rank: 6, color: "#d4a520" }
  - { id: lesser_great, name: "A Lesser Great Helmet", rank: 7, color: "#e0a400" }
  - { id: great,     name: "The Great Helmet",        rank: 8,  color: "#eda800" }
  - { id: almost_biggest, name: "The Almost Biggest Helmet", rank: 9, color: "#f7b400" }
  - { id: biggest,   name: "The Biggest Helmet",      rank: 10, color: "#ffc400" }
